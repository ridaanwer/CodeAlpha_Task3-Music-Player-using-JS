<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>

    <div class="music-player"> 
        <div class="nav-bar">
            <i class="fa-solid fa-arrow-left"></i>
            <p>Playing Now</p> 
            <i class="fa-solid fa-bars"></i>
        </div>
        <div class="album-art" style="width:130px; height:130px; border-radius:50px ; overflow: hidden;
        margin:15px auto; border:4px solid rgba(255, 255, 255, 0.2);" >
            <img src="img1.png" alt="Song Cover" style="width: 100p%; height:100%; object-fit:cover; border-radius:50%;"> 
        </div> 

        <div class="song-info">
            <h2 id="song-title">Song Title</h2> 
            <p id="artist-name">Artist Name</p> 
        </div>

        <div class="progress-container"> 
            <span id="current-time">0:00</span> 
            <input type="range" id="progress-bar" value="0" max="100"> 
            <span id="duration">0:00</span> 
        </div>

        <div class="controls"> 
            <button id="prev"><i class="fa-solid fa-backward-step"></i></button>
            <button id="play-pause" class="play-btn"><i class="fa-solid fa-play" id="play-icon"></i></button>
            <button id="next"><i class="fa-solid fa-forward-step"></i></button>
        </div> 

        <div class="volume-container"> 
            <i class="fa-solid fa-volume-high"></i>
            <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1">
        </div>

        <div class="playlist"> 
            <h3>Playlist</h3>
            <ul id="playlist-list"> 
            </ul>
        </div>
    </div>

    <script src="script.js"></script> 
</body>
</html>
